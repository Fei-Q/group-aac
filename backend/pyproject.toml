[project]
name = "group-aac-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.140.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.51.0",
  "psycopg[binary]>=3.3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.0",
  "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
